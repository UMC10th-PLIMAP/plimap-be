plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

def plimapAot = providers.gradleProperty('plimapAot').orElse('false').get()
if (!(plimapAot in ['true', 'false'])) {
    throw new GradleException('plimapAot must be true or false')
}
if (plimapAot == 'true') {
    apply plugin: 'org.springframework.boot.aot'

    tasks.named('processAot') {
        def generation = new Properties()
        file('scripts/spring-aot/generation.properties').withInputStream { generation.load(it) }
        args '--spring.profiles.active=prod'
        generation.each { key, value -> args "--${key}=${value}" }
        environment 'GOOGLE_APPLICATION_CREDENTIALS', file('scripts/appcds/training-credentials.json').absolutePath
        environment 'GOOGLE_CLOUD_PROJECT', 'plimap-aot-generation'
    }

    tasks.register('resolveAotDependencies') {
        doLast {
            ['compileClasspath', 'runtimeClasspath', 'aotCompileClasspath', 'aotRuntimeClasspath'].each {
                configurations.getByName(it).resolve()
            }
        }
    }

    tasks.register('verifyAotArtifact') {
        dependsOn tasks.named('bootJar')
        doLast {
            def initializer = 'BOOT-INF/classes/com/example/plimap/PlimapApplication__ApplicationContextInitializer.class'
            if (zipTree(tasks.named('bootJar').get().archiveFile.get()).matching { include initializer }.isEmpty()) {
                throw new GradleException('Generated prod AOT initializer is missing from bootJar')
            }
            def marker = layout.buildDirectory.file('spring-aot/profile').get().asFile
            marker.parentFile.mkdirs()
            marker.text = 'prod\n'
        }
    }
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'PLIMAP'

def querydslVersion = '7.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Google Cloud Storage
    implementation 'com.google.cloud:google-cloud-storage:2.69.0'

    // 금칙어 필터
    implementation 'io.github.vaneproject:badwordfiltering:1.0.0'
}

tasks.named('compileJava') {
    options.generatedSourceOutputDirectory = layout.buildDirectory.dir('generated/sources/annotationProcessor/java/main').get().asFile
}

tasks.named('compileTestJava') {
    options.generatedSourceOutputDirectory = layout.buildDirectory.dir('generated/sources/annotationProcessor/java/test').get().asFile
}

tasks.named('test') {
    useJUnitPlatform()
}
